name: ci

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
      - LICENSE
      - LICENSE-PowerToys-MIT.txt
  pull_request:
    paths-ignore:
      - README.md
      - LICENSE
      - LICENSE-PowerToys-MIT.txt
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------- Windows x64（MSVC，正式产物 + 功能自测）
  build-msvc:
    runs-on: windows-2022
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Show version
        shell: pwsh
        run: Write-Host "VERSION = $((Get-Content VERSION -Raw).Trim())"
      - name: Configure (Visual Studio 2022, x64)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build release
        run: cmake --build build --config Release
      - name: Collect artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item build\Release\FileLocksmith.exe out\FileLocksmith-x64.exe
          (Get-Item out\FileLocksmith-x64.exe).VersionInfo | Format-List FileVersion, ProductVersion, FileDescription
      - name: Smoke test (版本号 + 系统兼容性声明)
        shell: pwsh
        run: |
          $expected = (Get-Content VERSION -Raw).Trim()
          $exe = (Resolve-Path 'out\FileLocksmith-x64.exe').Path

          # 用 cmd 包一层：PowerShell 会把 Windows 子系统的 exe 当图形程序，不等待也不捕获输出
          $actual = (& cmd /c "`"$exe`" --version" | Out-String).Trim()
          Write-Host "VERSION 文件: $expected"
          Write-Host "--version 输出:"
          Write-Host $actual
          if ($actual -notmatch [regex]::Escape($expected)) { throw "版本号不一致" }

          # 声明兼容 Win10：manifest 里必须有对应 supportedOS GUID（Windows 靠它决定版本相关行为）
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $text = [System.Text.Encoding]::UTF8.GetString($bytes)
          foreach ($guid in @('8e0f7a12-bfb3-4fe8-b9a5-48fd50a15a9a', '1f676c76-80e1-4239-95bb-83d0f6d0da78')) {
            if ($text -notmatch $guid) { throw "manifest 缺少 supportedOS GUID $guid" }
          }
          Write-Host "manifest: 已声明 Windows 8.1 / 10 / 11 兼容"

          # PE 头：必须是 x64，且子系统版本不能高过 Vista(6.0)，否则老系统直接拒绝加载
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 0x4)
          $optHeader = $peOffset + 24
          $subsystemMajor = [BitConverter]::ToUInt16($bytes, $optHeader + 0x30)
          $subsystemMinor = [BitConverter]::ToUInt16($bytes, $optHeader + 0x32)
          $subsystem = [BitConverter]::ToUInt16($bytes, $optHeader + 0x44)
          Write-Host ("PE: machine=0x{0:X4} subsystem={1} subsystemVersion={2}.{3}" -f $machine, $subsystem, $subsystemMajor, $subsystemMinor)
          if ($machine -ne 0x8664) { throw "不是 x64 产物 (machine=0x{0:X4})" -f $machine }
          if ($subsystem -ne 2) { throw "不是 Windows GUI 子系统（双击会闪控制台）" }
          if ($subsystemMajor -gt 6) { throw "子系统版本 $subsystemMajor.$subsystemMinor 要求比 Vista 更新的系统" }

      # 真机端到端自测：找占用者 + 结束占用者
      # 真机端到端自测：找占用者 + 结束占用者
      #
      # 注意：exe 是 Windows 子系统（双击不闪控制台）。PowerShell 7 用 `& exe` 直接调用时
      # 会把它判定为图形程序 —— 不等待、也不捕获输出（$LASTEXITCODE 为空）。所以这里统一
      # 用 Start-Process 重定向到文件，行为完全确定。
      - name: Functional test (真实占用检测 + 结束占用进程)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path 'out\FileLocksmith-x64.exe').Path
          $dir = Join-Path $env:RUNNER_TEMP 'fl-test'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $file = Join-Path $dir 'locked.txt'
          Set-Content -Path $file -Value 'hello'

          function Invoke-FL {
            param([string[]]$Arguments)
            $outFile = New-TemporaryFile
            $errFile = New-TemporaryFile
            $p = Start-Process -FilePath $exe -ArgumentList $Arguments -NoNewWindow -Wait -PassThru `
                 -RedirectStandardOutput $outFile.FullName -RedirectStandardError $errFile.FullName
            $stdout = Get-Content $outFile.FullName -Raw -Encoding UTF8
            $stderr = Get-Content $errFile.FullName -Raw -Encoding UTF8
            Remove-Item $outFile.FullName, $errFile.FullName -Force -ErrorAction SilentlyContinue
            if ($null -eq $stdout) { $stdout = '' }
            if ($null -eq $stderr) { $stderr = '' }
            [pscustomobject]@{ ExitCode = $p.ExitCode; StdOut = $stdout; StdErr = $stderr }
          }

          # --- 用例 1：当前 PowerShell 进程独占持有文件句柄 ---
          $stream = [System.IO.File]::Open($file, 'Open', 'ReadWrite', 'None')
          Write-Host "用例 1：本进程 PID = $PID 独占占用 $file"
          $r = Invoke-FL @($file, '--json', '--cli')
          $stream.Close()
          $stream.Dispose()
          Write-Host "  退出码: $($r.ExitCode)"
          Write-Host "  stdout: $($r.StdOut.Trim())"
          if ($r.StdErr) { Write-Host "  stderr: $($r.StdErr.Trim())" }
          if ($r.ExitCode -ne 0) { throw "用例 1 失败：退出码 $($r.ExitCode)" }
          if ($r.StdOut -notmatch '"pid"\s*:\s*' + $PID + '\b') { throw "用例 1 失败：未检测到占用者 PID $PID" }
          Write-Host "用例 1 通过：检测到占用进程 $PID"

          # --- 用例 2：另一个进程持有句柄，应能被检测到，并被 --kill 结束 ---
          $blocker = Start-Process -FilePath 'powershell.exe' -PassThru -WindowStyle Hidden -ArgumentList @(
            '-NoProfile','-NonInteractive','-Command',
            "`$f=[System.IO.File]::Open('$file','Open','ReadWrite','None'); Start-Sleep -Seconds 300"
          )
          Write-Host "用例 2：阻塞进程 PID = $($blocker.Id)"
          $found = $false
          for ($i = 0; $i -lt 6; $i++) {
            Start-Sleep -Seconds 5
            $r2 = Invoke-FL @($file, '--json', '--cli')
            Write-Host "  第 $($i+1) 次查询 stdout: $($r2.StdOut.Trim())"
            if ($r2.StdOut -match '"pid"\s*:\s*' + $blocker.Id + '\b') { $found = $true; break }
          }
          if (-not $found) {
            Stop-Process -Id $blocker.Id -Force -ErrorAction SilentlyContinue
            throw "用例 2 失败：未检测到阻塞进程 $($blocker.Id)"
          }
          Write-Host "用例 2 通过：检测到阻塞进程 $($blocker.Id)"

          $r3 = Invoke-FL @($file, '--kill', '--cli')
          Write-Host "  --kill stdout: $($r3.StdOut.Trim())"
          Start-Sleep -Seconds 3
          if (-not $blocker.HasExited) {
            Stop-Process -Id $blocker.Id -Force -ErrorAction SilentlyContinue
            throw "用例 2 失败：--kill 没有结束掉阻塞进程"
          }
          Write-Host "用例 2 通过：--kill 已结束阻塞进程 $($blocker.Id)"

          # --- 用例 3：解锁后不应再报占用 ---
          Start-Sleep -Seconds 2
          $r4 = Invoke-FL @($file, '--json', '--cli')
          Write-Host "用例 3 查询 stdout: $($r4.StdOut.Trim())"
          if ($r4.StdOut -match '"pid"') { throw "用例 3 失败：进程都结束了却仍报告占用" }
          Write-Host "用例 3 通过：无占用"

          # --- 用例 4：强制解除占用（关闭别人的句柄，但不结束进程）---
          $blocker2 = Start-Process -FilePath 'powershell.exe' -PassThru -WindowStyle Hidden -ArgumentList @(
            '-NoProfile','-NonInteractive','-Command',
            "`$f=[System.IO.File]::Open('$file','Open','ReadWrite','None'); Start-Sleep -Seconds 300"
          )
          Start-Sleep -Seconds 5
          $r5 = Invoke-FL @($file, '--unlock', '--cli')
          Write-Host "用例 4：阻塞进程 PID = $($blocker2.Id)"
          Write-Host "  --unlock stdout: $($r5.StdOut.Trim())"
          if ($r5.ExitCode -ne 0) { throw "用例 4 失败：退出码 $($r5.ExitCode)" }
          if ($r5.StdOut -notmatch '已强制关闭 [1-9]') { throw "用例 4 失败：一个句柄都没关掉" }
          Start-Sleep -Seconds 1
          if ($blocker2.HasExited) {
            Stop-Process -Id $blocker2.Id -Force -ErrorAction SilentlyContinue
            throw "用例 4 失败：阻塞进程被结束了，强制解锁不应该结束进程"
          }
          $stillLocked = $false
          try {
            $probe = [System.IO.File]::Open($file, 'Open', 'ReadWrite', 'None')
            $probe.Close(); $probe.Dispose()
          } catch {
            $stillLocked = $true
          }
          Stop-Process -Id $blocker2.Id -Force -ErrorAction SilentlyContinue
          if ($stillLocked) { throw "用例 4 失败：句柄关掉了，但文件仍打不开" }
          Write-Host "用例 4 通过：文件已解锁，而进程 $($blocker2.Id) 仍然活着"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FileLocksmith-x64.exe
          path: out/FileLocksmith-x64.exe
          if-no-files-found: error

  # ---------------------------------------------------------------- Linux 交叉编译（MinGW，可复现构建）
  build-mingw:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Install MinGW-w64 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-mingw-w64-x86-64 cmake
      - name: Configure (cross compile to Windows x64)
        run: cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE=toolchain-mingw.cmake -DCMAKE_BUILD_TYPE=Release
      - name: Build release
        run: cmake --build build -j"$(nproc)"
      - name: Collect artifact
        run: |
          mkdir -p out
          cp build/FileLocksmith.exe out/FileLocksmith-x64-mingw.exe
          file out/FileLocksmith-x64-mingw.exe || true
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FileLocksmith-x64-mingw.exe
          path: out/FileLocksmith-x64-mingw.exe
          if-no-files-found: error

  # ---------------------------------------------------------------- 发布
  # 仅当 VERSION 文件里的版本号尚无对应 tag 时创建 Release（普通提交只构建不发布）
  release:
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - build-msvc
      - build-mingw
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Get version
        id: version
        run: echo "VERSION=$(cat VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
      - name: Check tag
        uses: mukunku/tag-exists-action@v1.6.0
        id: check-tag
        with:
          tag: v${{ steps.version.outputs.VERSION }}
      - name: Download artifacts
        if: steps.check-tag.outputs.exists == 'false'
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Release
        if: steps.check-tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: v${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, '-') }}
          files: |
            artifacts/FileLocksmith-x64.exe
            artifacts/FileLocksmith-x64-mingw.exe
