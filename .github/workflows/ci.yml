name: ci

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md
      - README.en.md
      - docs/**
      - LICENSE
      - LICENSE-PowerToys-MIT.txt
  pull_request:
    paths-ignore:
      - README.md
      - README.en.md
      - docs/**
      - LICENSE
      - LICENSE-PowerToys-MIT.txt
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------- Windows x64（MSVC，正式产物 + 功能自测）
  build-msvc:
    runs-on: windows-2022
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Show version
        shell: pwsh
        run: Write-Host "VERSION = $((Get-Content VERSION -Raw).Trim())"
      - name: Configure (Visual Studio 2022, x64)
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
      - name: Build release
        run: cmake --build build --config Release
      - name: Collect artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item build\Release\FileLocksmith.exe out\FileLocksmith-x64.exe
          (Get-Item out\FileLocksmith-x64.exe).VersionInfo | Format-List FileVersion, ProductVersion, FileDescription
      - name: Smoke test (版本号 + 系统兼容性声明)
        shell: pwsh
        run: |
          $expected = (Get-Content VERSION -Raw).Trim()
          $exe = (Resolve-Path 'out\FileLocksmith-x64.exe').Path

          # 用 cmd 包一层：PowerShell 会把 Windows 子系统的 exe 当图形程序，不等待也不捕获输出
          $actual = (& cmd /c "`"$exe`" --version" | Out-String).Trim()
          Write-Host "VERSION 文件: $expected"
          Write-Host "--version 输出:"
          Write-Host $actual
          if ($actual -notmatch [regex]::Escape($expected)) { throw "版本号不一致" }

          # 声明兼容 Win10：manifest 里必须有对应 supportedOS GUID（Windows 靠它决定版本相关行为）
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $text = [System.Text.Encoding]::UTF8.GetString($bytes)
          foreach ($guid in @('8e0f7a12-bfb3-4fe8-b9a5-48fd50a15a9a', '1f676c76-80e1-4239-95bb-83d0f6d0da78')) {
            if ($text -notmatch $guid) { throw "manifest 缺少 supportedOS GUID $guid" }
          }
          Write-Host "manifest: 已声明 Windows 8.1 / 10 / 11 兼容"

          # PE 头：必须是 x64，且子系统版本不能高过 Vista(6.0)，否则老系统直接拒绝加载
          $peOffset = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $peOffset + 0x4)
          $optHeader = $peOffset + 24
          $subsystemMajor = [BitConverter]::ToUInt16($bytes, $optHeader + 0x30)
          $subsystemMinor = [BitConverter]::ToUInt16($bytes, $optHeader + 0x32)
          $subsystem = [BitConverter]::ToUInt16($bytes, $optHeader + 0x44)
          Write-Host ("PE: machine=0x{0:X4} subsystem={1} subsystemVersion={2}.{3}" -f $machine, $subsystem, $subsystemMajor, $subsystemMinor)
          if ($machine -ne 0x8664) { throw "不是 x64 产物 (machine=0x{0:X4})" -f $machine }
          if ($subsystem -ne 2) { throw "不是 Windows GUI 子系统（双击会闪控制台）" }
          if ($subsystemMajor -gt 6) { throw "子系统版本 $subsystemMajor.$subsystemMinor 要求比 Vista 更新的系统" }

      # 真机端到端自测：找占用者 + 结束占用者
      # 真机端到端自测：找占用者 + 结束占用者
      #
      # 注意：exe 是 Windows 子系统（双击不闪控制台）。PowerShell 7 用 `& exe` 直接调用时
      # 会把它判定为图形程序 —— 不等待、也不捕获输出（$LASTEXITCODE 为空）。所以这里统一
      # 用 Start-Process 重定向到文件，行为完全确定。
      - name: Functional test (真实占用检测 + 结束占用进程)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = (Resolve-Path 'out\FileLocksmith-x64.exe').Path
          $dir = Join-Path $env:RUNNER_TEMP 'fl-test'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $file = Join-Path $dir 'locked.txt'
          Set-Content -Path $file -Value 'hello'

          function Invoke-FL {
            param([string[]]$Arguments)
            $outFile = New-TemporaryFile
            $errFile = New-TemporaryFile
            $p = Start-Process -FilePath $exe -ArgumentList $Arguments -NoNewWindow -Wait -PassThru `
                 -RedirectStandardOutput $outFile.FullName -RedirectStandardError $errFile.FullName
            $stdout = Get-Content $outFile.FullName -Raw -Encoding UTF8
            $stderr = Get-Content $errFile.FullName -Raw -Encoding UTF8
            Remove-Item $outFile.FullName, $errFile.FullName -Force -ErrorAction SilentlyContinue
            if ($null -eq $stdout) { $stdout = '' }
            if ($null -eq $stderr) { $stderr = '' }
            [pscustomobject]@{ ExitCode = $p.ExitCode; StdOut = $stdout; StdErr = $stderr }
          }

          # --- 用例 1：当前 PowerShell 进程独占持有文件句柄 ---
          $stream = [System.IO.File]::Open($file, 'Open', 'ReadWrite', 'None')
          Write-Host "用例 1：本进程 PID = $PID 独占占用 $file"
          $r = Invoke-FL @($file, '--json', '--cli')
          $stream.Close()
          $stream.Dispose()
          Write-Host "  退出码: $($r.ExitCode)"
          Write-Host "  stdout: $($r.StdOut.Trim())"
          if ($r.StdErr) { Write-Host "  stderr: $($r.StdErr.Trim())" }
          if ($r.ExitCode -ne 0) { throw "用例 1 失败：退出码 $($r.ExitCode)" }
          if ($r.StdOut -notmatch '"pid"\s*:\s*' + $PID + '\b') { throw "用例 1 失败：未检测到占用者 PID $PID" }
          Write-Host "用例 1 通过：检测到占用进程 $PID"

          # --- 用例 2：另一个进程持有句柄，应能被检测到，并被 --kill 结束 ---
          $blocker = Start-Process -FilePath 'powershell.exe' -PassThru -WindowStyle Hidden -ArgumentList @(
            '-NoProfile','-NonInteractive','-Command',
            "`$f=[System.IO.File]::Open('$file','Open','ReadWrite','None'); Start-Sleep -Seconds 300"
          )
          Write-Host "用例 2：阻塞进程 PID = $($blocker.Id)"
          $found = $false
          for ($i = 0; $i -lt 6; $i++) {
            Start-Sleep -Seconds 5
            $r2 = Invoke-FL @($file, '--json', '--cli')
            Write-Host "  第 $($i+1) 次查询 stdout: $($r2.StdOut.Trim())"
            if ($r2.StdOut -match '"pid"\s*:\s*' + $blocker.Id + '\b') { $found = $true; break }
          }
          if (-not $found) {
            Stop-Process -Id $blocker.Id -Force -ErrorAction SilentlyContinue
            throw "用例 2 失败：未检测到阻塞进程 $($blocker.Id)"
          }
          Write-Host "用例 2 通过：检测到阻塞进程 $($blocker.Id)"

          $r3 = Invoke-FL @($file, '--kill', '--cli')
          Write-Host "  --kill stdout: $($r3.StdOut.Trim())"
          Start-Sleep -Seconds 3
          if (-not $blocker.HasExited) {
            Stop-Process -Id $blocker.Id -Force -ErrorAction SilentlyContinue
            throw "用例 2 失败：--kill 没有结束掉阻塞进程"
          }
          Write-Host "用例 2 通过：--kill 已结束阻塞进程 $($blocker.Id)"

          # --- 用例 3：解锁后不应再报占用 ---
          Start-Sleep -Seconds 2
          $r4 = Invoke-FL @($file, '--json', '--cli')
          Write-Host "用例 3 查询 stdout: $($r4.StdOut.Trim())"
          if ($r4.StdOut -match '"pid"') { throw "用例 3 失败：进程都结束了却仍报告占用" }
          Write-Host "用例 3 通过：无占用"

          # --- 用例 4：强制解除占用（关闭别人的句柄，但不结束进程）---
          $blocker2 = Start-Process -FilePath 'powershell.exe' -PassThru -WindowStyle Hidden -ArgumentList @(
            '-NoProfile','-NonInteractive','-Command',
            "`$f=[System.IO.File]::Open('$file','Open','ReadWrite','None'); Start-Sleep -Seconds 300"
          )
          Start-Sleep -Seconds 5
          $r5 = Invoke-FL @($file, '--unlock', '--cli')
          Write-Host "用例 4：阻塞进程 PID = $($blocker2.Id)"
          Write-Host "  --unlock stdout: $($r5.StdOut.Trim())"
          if ($r5.ExitCode -ne 0) { throw "用例 4 失败：退出码 $($r5.ExitCode)" }
          if ($r5.StdOut -notmatch '已强制关闭 [1-9]') { throw "用例 4 失败：一个句柄都没关掉" }
          Start-Sleep -Seconds 1
          if ($blocker2.HasExited) {
            Stop-Process -Id $blocker2.Id -Force -ErrorAction SilentlyContinue
            throw "用例 4 失败：阻塞进程被结束了，强制解锁不应该结束进程"
          }
          $stillLocked = $false
          try {
            $probe = [System.IO.File]::Open($file, 'Open', 'ReadWrite', 'None')
            $probe.Close(); $probe.Dispose()
          } catch {
            $stillLocked = $true
          }
          Stop-Process -Id $blocker2.Id -Force -ErrorAction SilentlyContinue
          if ($stillLocked) { throw "用例 4 失败：句柄关掉了，但文件仍打不开" }
          Write-Host "用例 4 通过：文件已解锁，而进程 $($blocker2.Id) 仍然活着"

          # --- 用例 5：右键菜单的开启 / 关闭（HKCU，无需管理员）---
          $menuKey = 'HKCU:\Software\Classes\*\shell\FileLocksmith'
          $r6 = Invoke-FL @('--register', '--cli')
          Write-Host "  --register stdout: $($r6.StdOut.Trim())"
          if ($r6.ExitCode -ne 0) { throw "用例 5 失败：--register 退出码 $($r6.ExitCode)" }
          # 注意：路径里有 `*`，PowerShell 的注册表 provider 会当通配符，必须用 -LiteralPath
          if (-not (Test-Path -LiteralPath $menuKey)) { throw "用例 5 失败：注册后 $menuKey 不存在" }
          $command = (Get-Item -LiteralPath "$menuKey\command").GetValue('')
          Write-Host "  注册的命令: $command"
          if ($command -notmatch [regex]::Escape('FileLocksmith-x64.exe')) { throw "用例 5 失败：命令没指向本 exe，实际是 '$command'" }
          if ($command -notmatch [regex]::Escape('"%1"')) { throw "用例 5 失败：命令里没有 %1 参数" }
          if (-not (Test-Path -LiteralPath 'HKCU:\Software\Classes\Directory\shell\FileLocksmith')) { throw "用例 5 失败：文件夹右键没注册" }
          if (-not (Test-Path -LiteralPath 'HKCU:\Software\Classes\Directory\Background\shell\FileLocksmith')) { throw "用例 5 失败：目录空白处右键没注册" }
          $backgroundCommand = (Get-Item -LiteralPath 'HKCU:\Software\Classes\Directory\Background\shell\FileLocksmith\command').GetValue('')
          Write-Host "  目录空白处的命令: $backgroundCommand"
          if ($backgroundCommand -notmatch [regex]::Escape('%V')) { throw "用例 5 失败：目录空白处应该用 %V 而不是 %1" }
          $r7 = Invoke-FL @('--unregister', '--cli')
          if (Test-Path -LiteralPath $menuKey) { throw "用例 5 失败：--unregister 之后注册表项还在" }
          Write-Host "用例 5 通过：右键菜单可以开启 / 关闭，命令指向正确的 exe"

          # --- 用例 6：「发送到」快捷方式（走 IShellLink COM 那条路）---
          $lnk = Join-Path $env:APPDATA 'Microsoft\Windows\SendTo\FileLocksmith.lnk'
          $r8 = Invoke-FL @('--sendto', '--cli')
          Write-Host "  --sendto stdout: $($r8.StdOut.Trim())"
          if ($r8.ExitCode -ne 0) { throw "用例 6 失败：--sendto 退出码 $($r8.ExitCode)" }
          if (-not (Test-Path $lnk)) { throw "用例 6 失败：快捷方式没创建出来" }
          Remove-Item $lnk -Force -ErrorAction SilentlyContinue
          Write-Host "用例 6 通过：已创建并清理「发送到」快捷方式"

          # --- 用例 7：打不开的路径不能被当成"没有占用" ---
          $ghost = Join-Path $env:RUNNER_TEMP 'fl-test\does-not-exist.txt'
          $r9 = Invoke-FL @($ghost, '--json', '--cli')
          Write-Host "  stdout: $($r9.StdOut.Trim())"
          if ($r9.StdOut -notmatch '"unresolved"') { throw "用例 7 失败：JSON 里没有 unresolved 字段" }
          if ($r9.StdOut -notmatch 'does-not-exist') { throw "用例 7 失败：没有报出无效路径" }
          Write-Host "用例 7 通过：无效路径会被明确报出"

          # --- 用例 8：--json 的 stdout 必须只有 JSON（诊断信息走 stderr）---
          $blocker3 = Start-Process -FilePath 'powershell.exe' -PassThru -WindowStyle Hidden -ArgumentList @(
            '-NoProfile','-NonInteractive','-Command',
            "`$f=[System.IO.File]::Open('$file','Open','ReadWrite','None'); Start-Sleep -Seconds 300"
          )
          Start-Sleep -Seconds 5
          $r10 = Invoke-FL @($file, '--json', '--unlock', '--cli')
          Write-Host "  stdout: $($r10.StdOut.Trim())"
          Write-Host "  stderr: $($r10.StdErr.Trim())"
          Stop-Process -Id $blocker3.Id -Force -ErrorAction SilentlyContinue
          try {
            $null = $r10.StdOut.Trim() | ConvertFrom-Json
          } catch {
            throw "用例 8 失败：--json 的 stdout 不是合法 JSON —— $_"
          }
          if ($r10.StdOut.Trim() -notmatch '^\{.*\}$') { throw "用例 8 失败：stdout 里混进了非 JSON 内容" }
          if ($r10.StdErr -notmatch '已强制关闭') { throw "用例 8 失败：诊断信息没有走 stderr" }
          Write-Host "用例 8 通过：stdout 只有一行 JSON，诊断信息在 stderr"

          # --- 用例 9：拖动应用快捷方式 → 展开成整棵进程树 → 全部结束 ---
          # 用唯一名字的副本，避免误伤系统里的 cmd.exe / ping.exe
          $appDir = Join-Path $env:RUNNER_TEMP 'fl-app-test'
          New-Item -ItemType Directory -Force -Path $appDir | Out-Null
          $appExe = Join-Path $appDir 'fl-app.exe'
          $childExe = Join-Path $appDir 'fl-child.exe'
          Copy-Item "$env:SystemRoot\System32\cmd.exe" $appExe -Force
          Copy-Item "$env:SystemRoot\System32\ping.exe" $childExe -Force
          Set-Content -Path (Join-Path $appDir 'run.bat') -Value "`"$childExe`" -n 300 127.0.0.1" -Encoding ASCII

          $link = Join-Path $appDir 'fl-app.lnk'
          $shell = New-Object -ComObject WScript.Shell
          $shortcut = $shell.CreateShortcut($link)
          $shortcut.TargetPath = $appExe
          $shortcut.Save()

          $root = Start-Process -FilePath $appExe -ArgumentList @('/c', (Join-Path $appDir 'run.bat')) -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 5
          $child = Get-CimInstance Win32_Process -Filter "ParentProcessId = $($root.Id)" -ErrorAction SilentlyContinue | Select-Object -First 1
          Write-Host "用例 9：根进程 $($root.Id)，子进程 $($child.ProcessId)"
          if (-not $child) { throw "用例 9 失败：没造出父子进程对" }

          $r11 = Invoke-FL @($link, '--json', '--cli')
          Write-Host "  stdout: $($r11.StdOut.Trim())"
          if ($r11.StdOut -notmatch "`"pid`":\s*$($root.Id)\b") { throw "用例 9 失败：没报出根进程 $($root.Id)" }
          if ($r11.StdOut -notmatch "`"pid`":\s*$($child.ProcessId)\b") { throw "用例 9 失败：没展开出子进程 $($child.ProcessId)" }

          $r12 = Invoke-FL @($link, '--kill', '--cli')
          Write-Host "  --kill stdout: $($r12.StdOut.Trim())"
          Start-Sleep -Seconds 3
          $rootAlive = $null -ne (Get-Process -Id $root.Id -ErrorAction SilentlyContinue)
          $childAlive = $null -ne (Get-Process -Id $child.ProcessId -ErrorAction SilentlyContinue)
          if ($rootAlive -or $childAlive) {
            Stop-Process -Id $root.Id, $child.ProcessId -Force -ErrorAction SilentlyContinue
            throw "用例 9 失败：进程树没被全部结束（root=$rootAlive child=$childAlive）"
          }
          Write-Host "用例 9 通过：快捷方式展开出父子进程，并全部结束"
          Remove-Item -LiteralPath $appDir -Recurse -Force -ErrorAction SilentlyContinue

          # --- 用例 10：--delete 删除被占用的文件（先关句柄，不结束进程）---
          $victim = Join-Path $dir 'to-delete.txt'
          Set-Content -Path $victim -Value 'bye'
          $locker4 = Start-Process -FilePath 'powershell.exe' -PassThru -WindowStyle Hidden -ArgumentList @(
            '-NoProfile','-NonInteractive','-Command',
            "`$f=[System.IO.File]::Open('$victim','Open','ReadWrite','None'); Start-Sleep -Seconds 300"
          )
          Start-Sleep -Seconds 5
          $r13 = Invoke-FL @($victim, '--delete', '--cli')
          Write-Host "  --delete stdout: $($r13.StdOut.Trim())"
          Write-Host "  --delete 退出码: $($r13.ExitCode)"
          $stillThere = Test-Path -LiteralPath $victim
          $lockerAlive = -not $locker4.HasExited
          Stop-Process -Id $locker4.Id -Force -ErrorAction SilentlyContinue
          if ($r13.ExitCode -ne 0) { throw "用例 10 失败：退出码 $($r13.ExitCode)" }
          if ($stillThere) { throw "用例 10 失败：被占用的文件没删掉" }
          if (-not $lockerAlive) { throw "用例 10 失败：占用进程被杀了，--delete 只应该关句柄" }
          Write-Host "用例 10 通过：被占用的文件已删除，占用进程仍在运行"

          # --- 用例 11：--no-unlock 时不替用户去关别人的句柄 ---
          $victim2 = Join-Path $dir 'no-unlock.txt'
          Set-Content -Path $victim2 -Value 'bye'
          $locker5 = Start-Process -FilePath 'powershell.exe' -PassThru -WindowStyle Hidden -ArgumentList @(
            '-NoProfile','-NonInteractive','-Command',
            "`$f=[System.IO.File]::Open('$victim2','Open','ReadWrite','None'); Start-Sleep -Seconds 300"
          )
          Start-Sleep -Seconds 5
          $r14 = Invoke-FL @($victim2, '--delete', '--no-unlock', '--cli')
          Write-Host "  stdout: $($r14.StdOut.Trim())"
          $stillThere2 = Test-Path -LiteralPath $victim2
          $locker5Alive = -not $locker5.HasExited
          Stop-Process -Id $locker5.Id -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath $victim2 -Force -ErrorAction SilentlyContinue
          if ($r14.ExitCode -eq 0) { throw "用例 11 失败：--no-unlock 下被占用应该删除失败" }
          if (-not $stillThere2) { throw "用例 11 失败：文件被删了，说明还是动了别人的句柄" }
          if (-not $locker5Alive) { throw "用例 11 失败：占用进程被结束了" }
          Write-Host "用例 11 通过：--no-unlock 下不动别人的句柄，失败即失败"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FileLocksmith-x64.exe
          path: out/FileLocksmith-x64.exe
          if-no-files-found: error

  # ---------------------------------------------------------------- Linux 交叉编译（MinGW，可复现构建）
  build-mingw:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4
      - name: Install MinGW-w64 toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-mingw-w64-x86-64 cmake
      - name: Configure (cross compile to Windows x64)
        run: cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE=toolchain-mingw.cmake -DCMAKE_BUILD_TYPE=Release
      - name: Build release
        run: cmake --build build -j"$(nproc)"
      - name: Collect artifact
        run: |
          mkdir -p out
          cp build/FileLocksmith.exe out/FileLocksmith-x64-mingw.exe
          file out/FileLocksmith-x64-mingw.exe || true
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FileLocksmith-x64-mingw.exe
          path: out/FileLocksmith-x64-mingw.exe
          if-no-files-found: error

  # ---------------------------------------------------------------- 发布
  # 仅当 VERSION 文件里的版本号尚无对应 tag 时创建 Release（普通提交只构建不发布）
  release:
    if: |
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - build-msvc
      - build-mingw
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Get version
        id: version
        run: echo "VERSION=$(cat VERSION | tr -d '[:space:]')" >> "$GITHUB_OUTPUT"
      - name: Check tag
        uses: mukunku/tag-exists-action@v1.6.0
        id: check-tag
        with:
          tag: v${{ steps.version.outputs.VERSION }}
      - name: Download artifacts
        if: steps.check-tag.outputs.exists == 'false'
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Release
        if: steps.check-tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: v${{ steps.version.outputs.VERSION }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, '-') }}
          files: |
            artifacts/FileLocksmith-x64.exe
            artifacts/FileLocksmith-x64-mingw.exe
